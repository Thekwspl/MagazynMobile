name: Pull Request checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: magazyn-mobile-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: androidTest API ${{ matrix.api }}
    if: github.head_ref == 'fix/1.2.0-release-gate-api26'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Włącz akcelerację emulatora
        run: sudo chmod 666 /dev/kvm
      - name: Testy na emulatorze
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          script: bash .github/scripts/check-android-instrumentation.sh ${{ matrix.api }}
      - name: Zachowaj raporty i logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-api-${{ matrix.api }}
          path: instrumentation-api-${{ matrix.api }}/
          if-no-files-found: warn

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustaw Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agent-service/package-lock.json

      - name: Testy agent-service (mocki)
        working-directory: agent-service
        run: npm ci && npm test

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Szybkie testy PR
        run: gradle test assembleDebug assembleDebugAndroidTest lintDebug --no-daemon --max-workers=1

      - name: Zbuduj testowe APK MagazynMobile
        if: github.event.pull_request.number == 9
        run: gradle assembleDebug --no-daemon --max-workers=1

      - name: Sprawdź izolację testowego APK
        if: github.event.pull_request.number == 9
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK")"
          grep -Fq "package: name='pl.magazyn.mobile.test'" <<< "$BADGING"
          grep -Fq "application-label:'MagazynMobile TEST'" <<< "$BADGING"
          grep -Fq 'applicationId = "pl.magazyn.mobile"' app/build.gradle.kts
          # Porównaj wersję APK z konfiguracją zamiast utrzymywać drugi numer wersji w CI.
          export BADGING
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          config = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          code = re.findall(r"^\s*versionCode\s*=\s*(\d+)\s*$", config, re.MULTILINE)
          name = re.findall(r'^\s*versionName\s*=\s*"([^"]+)"\s*$', config, re.MULTILINE)
          if len(code) != 1 or len(name) != 1 or int(code[0]) <= 0:
              raise SystemExit("Nie można jednoznacznie odczytać wersji aplikacji")
          package = next((line for line in os.environ["BADGING"].splitlines() if line.startswith("package:")), "")
          actual_code = re.search(r"versionCode='([^']+)'", package)
          actual_name = re.search(r"versionName='([^']+)'", package)
          if not actual_code or not actual_name or actual_code.group(1) != code[0] or actual_name.group(1) != name[0]:
              raise SystemExit("Wersja testowego APK różni się od app/build.gradle.kts")
          print(f"Wersja testowego APK: {name[0]} ({code[0]}) — zgodna")
          PY
          grep -Fq 'const val DATABASE_SCHEMA_VERSION = 25' app/src/main/java/pl/magazyn/mobile/data/DatabaseSchema.kt
          cp "$APK" "$RUNNER_TEMP/MagazynMobile-TEST.apk"

      - name: Sprawdź Room schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          schema_source = Path("app/src/main/java/pl/magazyn/mobile/data/DatabaseSchema.kt").read_text(encoding="utf-8")
          match = re.search(r"DATABASE_SCHEMA_VERSION\s*=\s*(\d+)", schema_source)
          if not match:
              raise SystemExit("Nie można odczytać DATABASE_SCHEMA_VERSION")

          version = int(match.group(1))
          schema = Path(f"app/schemas/pl.magazyn.mobile.data.AppDatabase/{version}.json")
          if not schema.is_file():
              raise SystemExit(f"Room/KSP nie wygenerował aktualnego schematu: {schema}")

          with schema.open(encoding="utf-8") as source:
              data = json.load(source)

          if data.get("database", {}).get("version") != version:
              raise SystemExit(f"Schema {schema} ma niezgodny numer wersji")

          tracked = subprocess.run(
              ["git", "ls-files", "--error-unmatch", str(schema)],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0

          if tracked:
              changed = subprocess.run(
                  ["git", "diff", "--quiet", "--", str(schema)]
              ).returncode != 0
              if changed:
                  raise SystemExit(
                      f"Room schema {version} jest już zapisany w repo, ale wygenerowana zawartość się zmieniła. "
                      "Najpewniej zmieniono model bazy bez zwiększenia DATABASE_SCHEMA_VERSION."
                  )
              print(f"Room schema {version}: OK, plik jest śledzony i zgodny.")
          else:
              print(
                  f"Room schema {version}: nowy plik nie jest jeszcze śledzony. "
                  "To jest dozwolone w PR; po merge workflow main utworzy automatyczny PR ze schema."
              )
          PY

      - name: Zachowaj Room schema do diagnostyki
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-pr-${{ github.event.pull_request.number }}
          path: app/schemas/pl.magazyn.mobile.data.AppDatabase/*.json
          if-no-files-found: warn

      - name: Zachowaj testowe APK do ręcznej instalacji
        if: github.event.pull_request.number == 9
        uses: actions/upload-artifact@v4
        with:
          name: MagazynMobile-TEST
          path: ${{ runner.temp }}/MagazynMobile-TEST.apk
          if-no-files-found: error

      - name: Podsumowanie
        if: success()
        run: echo "PR checks zakończone poprawnie. Można bezpiecznie przejść do merge po review."
