name: Test, build and publish Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: magazyn-mobile-main-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pobierz kod i tagi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v4

      - name: Upewnij się, że Android SDK 35 jest dostępne
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Odczytaj wersję i sprawdź publikację
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$APP_VERSION" || { echo "Nie znaleziono versionName w app/build.gradle.kts"; exit 1; }
          TAG="v$APP_VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            CREATE_TAG=false
          else
            CREATE_TAG=true
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            PUBLISH_RELEASE=false
          else
            PUBLISH_RELEASE=true
          fi

          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "create_tag=$CREATE_TAG" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Sprawdź sekrety podpisu
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Odtwórz prywatny klucz podpisujący
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/magazyn-release.jks"

      - name: Testy i podpisany build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/magazyn-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle test assembleRelease --no-daemon

      - name: Sprawdź podpis APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Przygotuj plik wydania
        if: steps.release.outputs.publish_release == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk MagazynMobile.apk

      - name: Utwórz tag wersji
        if: steps.release.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Magazyn Mobile $TAG"
          git push origin "$TAG"

      - name: Opublikuj GitHub Release
        if: steps.release.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: gh release create "$TAG" MagazynMobile.apk --verify-tag --generate-notes --title "Magazyn Mobile $TAG"

      - name: Podsumowanie bez nowej publikacji
        if: steps.release.outputs.publish_release != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "Testy i build zakończone. Wydanie $TAG już istnieje, więc nie utworzono duplikatu."
