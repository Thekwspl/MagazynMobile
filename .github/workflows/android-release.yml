name: Build and publish Android APK

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Sprawdź zgodność tagu z wersją aplikacji
        run: |
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "v$APP_VERSION" || (echo "Tag $GITHUB_REF_NAME nie odpowiada versionName $APP_VERSION" && exit 1)

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v4

      - name: Upewnij się, że Android SDK 35 jest dostępne
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Odtwórz prywatny klucz podpisujący
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/magazyn-release.jks"

      - name: Testy i podpisany build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/magazyn-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle test assembleRelease --no-daemon

      - name: Przygotuj plik wydania
        run: cp app/build/outputs/apk/release/app-release.apk MagazynMobile.apk

      - name: Opublikuj GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" MagazynMobile.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" MagazynMobile.apk --generate-notes --title "Magazyn Mobile $GITHUB_REF_NAME"
          fi
