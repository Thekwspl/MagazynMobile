name: Test, build and publish Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: magazyn-mobile-main-release
  cancel-in-progress: false

jobs:
  classify:
    name: Sprawdź czy potrzebny jest release
    runs-on: ubuntu-latest
    outputs:
      run_release: ${{ steps.classify.outputs.run_release }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Pobierz kod i tagi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Klasyfikuj zmianę
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$APP_VERSION" || {
            echo "::error::Nie znaleziono versionName w app/build.gradle.kts"
            exit 1
          }
          TAG="v$APP_VERSION"

          # Nowa wersja aplikacji nie ma jeszcze taga — uruchom pełny release gate.
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "reason=new-version" >> "$GITHUB_OUTPUT"
            echo "Brak taga $TAG. Uruchamiam pełny release gate."
            exit 0
          fi

          TAG_COMMIT=$(git rev-parse "$TAG^{commit}")

          # Pozwala ręcznie ponowić pełną walidację dokładnie tego samego commita.
          if [ "$TAG_COMMIT" = "$GITHUB_SHA" ]; then
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "reason=tagged-commit" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG wskazuje bieżący commit. Uruchamiam pełną walidację."
            exit 0
          fi

          echo "Istniejący tag: $TAG -> $TAG_COMMIT"
          echo "Bieżący commit: $GITHUB_SHA"
          echo "Zmiany od istniejącego wydania:"
          git diff --name-only "$TAG_COMMIT" "$GITHUB_SHA"

          RELEASE_RELEVANT=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              .github/*|AGENTS.md|README|README.*|docs/*)
                ;;
              *)
                RELEASE_RELEVANT=true
                echo "Plik wymagający nowej wersji aplikacji: $path"
                ;;
            esac
          done < <(git diff --name-only "$TAG_COMMIT" "$GITHUB_SHA")

          if [ "$RELEASE_RELEVANT" = "false" ]; then
            echo "run_release=false" >> "$GITHUB_OUTPUT"
            echo "reason=non-app-only" >> "$GITHUB_OUTPUT"
            echo "::notice::Od $TAG zmieniły się wyłącznie pliki CI/dokumentacji. Pomijam ponowną publikację APK."
            exit 0
          fi

          echo "::error::Wersja aplikacji nadal wynosi $APP_VERSION, ale od taga $TAG zmieniły się pliki aplikacji/release-relevant."
          echo "::error::Podnieś versionName/versionCode. Istniejący tag nie zostanie przesunięty."
          exit 1

  non_release_summary:
    name: Bez nowego APK
    needs: classify
    if: needs.classify.outputs.run_release == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Podsumowanie
        run: echo "Zmiana dotyczy wyłącznie CI/dokumentacji. Pełny build i publikacja APK zostały bezpiecznie pominięte."

  build:
    needs: classify
    if: needs.classify.outputs.run_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Pobierz kod i tagi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            emulator
            system-images;android-26;google_apis;x86_64
            system-images;android-35;google_apis;x86_64

      - name: Odczytaj wersję i sprawdź publikację
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$APP_VERSION" || { echo "Nie znaleziono versionName w app/build.gradle.kts"; exit 1; }
          TAG="v$APP_VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-parse "$TAG^{commit}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG wskazuje commit $TAG_COMMIT, a workflow buduje $GITHUB_SHA. Tag nie zostanie przesunięty automatycznie."
              exit 1
            fi
            CREATE_TAG=false
          else
            CREATE_TAG=true
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            PUBLISH_RELEASE=false
          else
            PUBLISH_RELEASE=true
          fi

          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "create_tag=$CREATE_TAG" >> "$GITHUB_OUTPUT"
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Sprawdź sekrety podpisu
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Odtwórz prywatny klucz podpisujący
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/magazyn-release.jks"

      - name: Testy
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/magazyn-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Warianty KSP eksportują schemat Room do wspólnego app/schemas.
        # Jeden worker zapobiega równoczesnemu zapisowi częściowego pliku JSON.
        run: gradle test --no-daemon --max-workers=1

      - name: Skompiluj testy instrumentacyjne
        run: gradle assembleDebugAndroidTest --no-daemon --max-workers=1

      - name: Zachowaj wygenerowany schemat Room
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-${{ steps.release.outputs.version }}
          path: app/schemas/pl.magazyn.mobile.data.AppDatabase/*.json
          if-no-files-found: warn

      - name: Sprawdź eksportowane schematy Room
        id: room_schema
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          schemas = sorted(Path("app/schemas").rglob("*.json"))
          if not schemas:
              raise SystemExit("Nie znaleziono eksportowanych schematów Room")
          for schema in schemas:
              with schema.open(encoding="utf-8") as source:
                  json.load(source)
              print(f"Poprawny JSON: {schema}")

          schema_source = Path("app/src/main/java/pl/magazyn/mobile/data/DatabaseSchema.kt").read_text(encoding="utf-8")
          match = re.search(r"DATABASE_SCHEMA_VERSION\s*=\s*(\d+)", schema_source)
          if not match:
              raise SystemExit("Nie można odczytać DATABASE_SCHEMA_VERSION")
          current_version = int(match.group(1))
          current_schema = Path(f"app/schemas/pl.magazyn.mobile.data.AppDatabase/{current_version}.json")
          if not current_schema.is_file():
              raise SystemExit(f"Brak eksportu aktualnego schematu Room: {current_schema}")
          with current_schema.open(encoding="utf-8") as source:
              exported = json.load(source)
          if exported.get("database", {}).get("version") != current_version:
              raise SystemExit(f"Eksport {current_schema} ma niezgodny numer wersji")
          print(f"Aktualny schema gate: {current_schema}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={current_version}\n")
              output.write(f"path={current_schema.as_posix()}\n")
          PY

      - name: Sprawdź Room schema i utwórz PR dla nowego pliku
        env:
          GH_TOKEN: ${{ github.token }}
          ROOM_SCHEMA_VERSION: ${{ steps.room_schema.outputs.version }}
          ROOM_SCHEMA_FILE: ${{ steps.room_schema.outputs.path }}
          APP_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          echo "ROOM SCHEMA CHECK"
          echo "Database schema version: $ROOM_SCHEMA_VERSION"
          echo "Generated file: $ROOM_SCHEMA_FILE"
          test -f "$ROOM_SCHEMA_FILE" || {
            echo "::error::Room/KSP nie wygenerował oczekiwanego pliku $ROOM_SCHEMA_FILE."
            exit 1
          }

          if git ls-files --error-unmatch "$ROOM_SCHEMA_FILE" >/dev/null 2>&1; then
            echo "Tracked by Git: YES"
            if ! git diff --quiet -- "$ROOM_SCHEMA_FILE"; then
              echo "::error::Room schema version $ROOM_SCHEMA_VERSION jest już zapisany w repo, ale wygenerowana zawartość się różni."
              echo "::error::Nie aktualizuję istniejącego schema automatycznie. Sprawdź zmianę modelu i czy DATABASE_SCHEMA_VERSION powinien zostać zwiększony."
              git diff -- "$ROOM_SCHEMA_FILE"
              exit 1
            fi
            echo "Tracked schema jest zgodny z wynikiem Room/KSP. Release gate kontynuuje."
            exit 0
          fi

          echo "Tracked by Git: NO"
          BRANCH="automation/room-schema-$ROOM_SCHEMA_VERSION"
          TITLE="Add Room schema $ROOM_SCHEMA_VERSION"
          GENERATED_COPY="$RUNNER_TEMP/room-schema-$ROOM_SCHEMA_VERSION.json"
          REMOTE_REF="refs/remotes/origin/$BRANCH"
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$BRANCH" | awk 'NR == 1 { print $1 }')"
          cp "$ROOM_SCHEMA_FILE" "$GENERATED_COPY"

          echo "Creating or updating automation branch: $BRANCH"
          git status --short

          BRANCH_IS_CURRENT=false
          if [ -n "$REMOTE_SHA" ]; then
            git fetch --no-tags origin "refs/heads/$BRANCH:$REMOTE_REF"
            REMOTE_PARENT="$(git rev-parse "$REMOTE_REF^" 2>/dev/null || true)"
            if [ "$REMOTE_PARENT" = "$GITHUB_SHA" ] && \
               git cat-file -e "$REMOTE_REF:$ROOM_SCHEMA_FILE" 2>/dev/null && \
               git show "$REMOTE_REF:$ROOM_SCHEMA_FILE" > "$RUNNER_TEMP/remote-room-schema.json" && \
               cmp -s "$GENERATED_COPY" "$RUNNER_TEMP/remote-room-schema.json"; then
              BRANCH_IS_CURRENT=true
              echo "Branch $BRANCH zawiera już identyczny schema dla źródłowego commita $GITHUB_SHA."
            fi
          fi

          if [ "$BRANCH_IS_CURRENT" != "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -C "$BRANCH" "$GITHUB_SHA"
            cp "$GENERATED_COPY" "$ROOM_SCHEMA_FILE"
            git add -- "$ROOM_SCHEMA_FILE"

            STAGED_FILES="$(git diff --cached --name-only)"
            if [ "$STAGED_FILES" != "$ROOM_SCHEMA_FILE" ]; then
              echo "::error::Commit automatyzacji zawierałby pliki inne niż oczekiwany Room schema."
              git status --short
              git diff --cached --name-only
              exit 1
            fi
            git diff --cached --check
            git diff --cached --stat
            git commit -m "$TITLE"

            if [ -n "$REMOTE_SHA" ]; then
              git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" origin "HEAD:refs/heads/$BRANCH"
            else
              git push origin "HEAD:refs/heads/$BRANCH"
            fi
          fi

          PR_URL="$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$PR_URL" ]; then
            BODY_FILE="$RUNNER_TEMP/room-schema-pr-body.md"
            cat > "$BODY_FILE" <<EOF
          Room schema: $ROOM_SCHEMA_VERSION
          Wersja aplikacji: $APP_VERSION
          Źródłowy commit: $GITHUB_SHA

          Plik \`$ROOM_SCHEMA_FILE\` został wygenerowany przez Room/KSP w release gate.

          Scal ten PR. Po merge workflow main uruchomi pełny release gate ponownie.
          EOF
            PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE")"
            echo "Created PR: $PR_URL"
          else
            echo "Existing PR: $PR_URL"
          fi

          echo "Room schema $ROOM_SCHEMA_VERSION został wygenerowany."
          echo "Automatyczny Pull Request został utworzony lub zaktualizowany: $PR_URL"
          echo "Release stopped intentionally. Scal PR; workflow po merge do main zweryfikuje release."
          exit 1

      - name: Włącz akcelerację emulatora
        run: sudo chmod 666 /dev/kvm

      - name: Krytyczne androidTest — API 26
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon --max-workers=1

      - name: Krytyczne androidTest — API 35
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon --max-workers=1

      - name: Podpisany build release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/magazyn-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --max-workers=1

      - name: Sprawdź podpis APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Przygotuj plik wydania
        if: steps.release.outputs.publish_release == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk MagazynMobile.apk

      - name: Utwórz tag wersji
        if: steps.release.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Magazyn Mobile $TAG"
          git push origin "$TAG"

      - name: Opublikuj GitHub Release
        if: steps.release.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: gh release create "$TAG" MagazynMobile.apk --verify-tag --generate-notes --title "Magazyn Mobile $TAG"

      - name: Podsumowanie bez nowej publikacji
        if: steps.release.outputs.publish_release != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: echo "Testy i build zakończone. Wydanie $TAG już istnieje, więc nie utworzono duplikatu."
