name: Build and publish Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Odczytaj wersję aplikacji
        id: version
        shell: bash
        run: |
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)

          if [ -z "$APP_VERSION" ]; then
            echo "Nie udało się odczytać versionName z app/build.gradle.kts"
            exit 1
          fi

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$APP_VERSION" >> "$GITHUB_OUTPUT"

          echo "Wersja aplikacji: $APP_VERSION"
          echo "Tag wydania: v$APP_VERSION"

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v4

      - name: Upewnij się, że Android SDK 35 jest dostępne
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Odtwórz prywatny klucz podpisujący
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/magazyn-release.jks"

      - name: Testy i podpisany build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/magazyn-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle test assembleRelease --no-daemon

      - name: Przygotuj plik wydania
        run: cp app/build/outputs/apk/release/app-release.apk MagazynMobile.apk

      - name: Sprawdź, czy tag już istnieje
        id: tag_check
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG już istnieje."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG nie istnieje."
          fi

      - name: Utwórz tag wydania
        if: steps.tag_check.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

      - name: Opublikuj GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          gh release create "$TAG" MagazynMobile.apk \
            --generate-notes \
            --title "Magazyn Mobile $TAG"

      - name: Informacja o istniejącym wydaniu
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          echo "Build zakończony poprawnie."
          echo "Wydanie ${{ steps.version.outputs.tag }} już istnieje, więc nie utworzono nowego Release."
